<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedGenius — Offline</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1   { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p    { font-size: 15px; color: #64748b; line-height: 1.6; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      background: #3b82f6;
      color: #fff;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #2563eb; }
    .cached-note {
      margin-top: 24px;
      font-size: 13px;
      color: #94a3b8;
    }
    .cached-note a { color: #3b82f6; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📵</div>
    <h1>You're Offline</h1>
    <p>
      MedGenius needs an internet connection for recommendations and OCR scanning.
      Some previously visited pages may still be available from cache.
    </p>
    <button class="btn" onclick="window.location.reload()">Try Again</button>
    <p class="cached-note">
      Or <a href="/">go to the home page</a> — it may be available offline.
    </p>
  </div>
  <script>
    // Auto-refresh when connection is restored
    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
